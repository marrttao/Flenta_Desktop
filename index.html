<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flenta</title>

    <script>
      (
        function ()
        {
          try
          {
            var storedJson = localStorage.getItem('theme');
            var theme = storedJson ? JSON.parse(storedJson) : 'system';

            var resolvedTheme = theme == 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : theme;

            document.documentElement.setAttribute('data-theme', resolvedTheme);
          }
          catch (exception) {}
        }
      )();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
